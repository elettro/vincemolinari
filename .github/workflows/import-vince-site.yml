name: Import Vince Molinari site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-vince-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Vince website from Elettro repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elettro/elettro.git /tmp/elettro-source
          git -C /tmp/elettro-source sparse-checkout set clients/vince

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/elettro-source/clients/vince/. ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Vince Molinari website from elettro/elettro"
          git push origin HEAD:main
